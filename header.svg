<svg xmlns="http://www.w3.org/2000/svg" width="900" height="220" viewBox="0 0 900 220">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f2027"/>
      <stop offset="50%" stop-color="#2c5364"/>
      <stop offset="100%" stop-color="#6C8EF5"/>
    </linearGradient>
    <clipPath id="round"><rect width="900" height="220" rx="16"/></clipPath>
  </defs>
  <style>
    .name { font: 700 44px 'Segoe UI', Helvetica, Arial, sans-serif; fill: #ffffff; opacity: 0; animation: fadeUp 1.2s ease-out 0.2s forwards; }
    .role { font: 500 20px 'Segoe UI', Helvetica, Arial, sans-serif; fill: #cfe0ff; letter-spacing: 3px; opacity: 0; animation: fadeUp 1.2s ease-out 0.8s forwards; }
    .wave1 { animation: drift 9s linear infinite; }
    .wave2 { animation: drift 14s linear infinite reverse; }
    .dot { animation: twinkle 3s ease-in-out infinite; }
    .d2 { animation-delay: 0.7s; } .d3 { animation-delay: 1.4s; } .d4 { animation-delay: 2.1s; }
    @keyframes fadeUp { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes drift { from { transform: translateX(0); } to { transform: translateX(-450px); } }
    @keyframes twinkle { 0%, 100% { opacity: 0.15; } 50% { opacity: 0.9; } }
  </style>
  <g clip-path="url(#round)">
    <rect width="900" height="220" fill="url(#bg)"/>
    <g class="wave1" opacity="0.25">
      <path d="M0 170 Q112 130 225 170 T450 170 T675 170 T900 170 T1125 170 T1350 170 V220 H0 Z" fill="#ffffff"/>
    </g>
    <g class="wave2" opacity="0.18">
      <path d="M0 185 Q112 150 225 185 T450 185 T675 185 T900 185 T1125 185 T1350 185 V220 H0 Z" fill="#ffffff"/>
    </g>
    <circle class="dot" cx="90" cy="45" r="2.5" fill="#fff"/>
    <circle class="dot d2" cx="240" cy="30" r="2" fill="#fff"/>
    <circle class="dot d3" cx="760" cy="55" r="3" fill="#fff"/>
    <circle class="dot d4" cx="620" cy="28" r="2" fill="#fff"/>
    <circle class="dot d2" cx="840" cy="120" r="2" fill="#fff"/>
    <circle class="dot d3" cx="55" cy="130" r="2" fill="#fff"/>
  </g>
  <text class="name" x="450" y="100" text-anchor="middle">Charan Sri Teja Burra</text>
  <text class="role" x="450" y="140" text-anchor="middle">FULL-STACK &amp; AI ENGINEER</text>
</svg>
